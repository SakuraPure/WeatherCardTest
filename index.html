<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Synesthetic Weather Card</title>
<style>
:root {
  --card-width: 420px;
  --card-height: 580px;
  --transition-duration: 1200ms;
  --scene-hue: 40;
  --scene-saturation: 70%;
  --scene-lightness: 55%;
  --glow-strength: 0.25;
  --accent-color: hsl(var(--scene-hue), var(--scene-saturation), 65%);
  --scene-ambient: hsl(calc(var(--scene-hue) + 180), 50%, 12%);
  --bg-color: var(--scene-ambient);
  --text-color: rgba(255, 255, 255, 0.92);
  --card-ambient: rgba(12, 16, 26, 0.55);
  --pointer-x: 50vw;
  --pointer-y: 50vh;
  --pointer-active: 0;
  --color-temp-rgb: 255, 215, 170;
  --humidity-level: 0.6;
  --humidity-glow: 0.8;
  --wind-level: 0.25;
  --wind-angle: 0deg;
  --wind-opacity: 0.6;
  --uv-level: 0.4;
  --dew-shift: 0.5;
  --dew-opacity: 0.6;
  font-family: "Segoe UI", "PingFang SC", "Hiragino Sans", "Helvetica Neue", sans-serif;
}
* {
  box-sizing: border-box;
  user-select: none;
}
body {
  margin: 0;
  background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 60%),
    radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.04), transparent 70%),
    radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.06), transparent 70%),
    #02030c;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--text-color);
}
body::before {
  content: "";
  position: fixed;
  width: 70vw;
  height: 70vw;
  max-width: 780px;
  max-height: 780px;
  top: calc(var(--pointer-y) - 35vw);
  left: calc(var(--pointer-x) - 35vw);
  background: radial-gradient(
    circle,
    rgba(var(--color-temp-rgb), 0.4),
    rgba(var(--color-temp-rgb), 0.05) 55%,
    transparent 75%
  );
  mix-blend-mode: screen;
  opacity: calc(var(--pointer-active) * 0.6);
  filter: blur(18px);
  pointer-events: none;
  transition: opacity 400ms ease, transform 600ms ease;
  transform: translate3d(0, 0, 0);
  z-index: 0;
}
canvas#sky {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
}
#card-wrapper {
  position: relative;
  width: var(--card-width);
  height: var(--card-height);
  perspective: 1200px;
  z-index: 1;
}
.weather-card {
  position: absolute;
  inset: 0;
  border-radius: 30px;
  padding: 32px;
  background:
    radial-gradient(circle at 30% 20%, rgba(var(--color-temp-rgb), 0.22), transparent 65%),
    linear-gradient(160deg, rgba(var(--color-temp-rgb), 0.15), rgba(255, 255, 255, 0.02)),
    var(--card-ambient);
  backdrop-filter: blur(24px) saturate(1.35);
  box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
  display: flex;
  flex-direction: column;
  gap: 18px;
  transition: transform 500ms ease, box-shadow 500ms ease;
  transform-style: preserve-3d;
}
.weather-card::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 32px;
  background: linear-gradient(120deg,
      rgba(255, 255, 255, 0.08),
      rgba(255, 255, 255, 0.03) 40%,
      rgba(255, 255, 255, 0.12) 65%,
      rgba(255, 255, 255, 0.02));
  filter: blur(0.5px);
  z-index: -1;
}
.weather-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 30px;
  background: radial-gradient(circle at top, rgba(255, 255, 255, calc(0.6 * var(--glow-strength))), transparent 55%),
    radial-gradient(circle at bottom, rgba(255, 255, 255, calc(0.25 * var(--glow-strength))), transparent 60%);
  mix-blend-mode: screen;
  opacity: 0.75;
  pointer-events: none;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
header .title {
  font-size: 1.6rem;
  letter-spacing: 0.08em;
  font-weight: 600;
  text-shadow: 0 0 12px rgba(0, 0, 0, 0.55);
}
header .scene-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.35), 0 0 20px rgba(255, 255, 255, 0.18);
  display: grid;
  place-items: center;
}
header .scene-icon span {
  font-size: 1.4rem;
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
}
.scene-switcher {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.scene-switcher button {
  border: none;
  border-radius: 16px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.08);
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background 350ms ease, transform 350ms ease;
}
.scene-switcher button:hover {
  transform: translateY(-4px);
}
.scene-switcher button.active {
  background: rgba(255, 255, 255, 0.18);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
}
.scene-switcher button span.icon {
  font-size: 1.35rem;
}
.scene-switcher button span.label {
  font-size: 0.78rem;
  letter-spacing: 0.04em;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px 12px;
}
.metric {
  position: relative;
  padding: 12px 10px 12px 16px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.05);
  overflow: hidden;
  display: grid;
  gap: 10px;
}
.metric::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(140deg, transparent, rgba(255, 255, 255, 0.14));
  mix-blend-mode: screen;
  opacity: 0.35;
}
.metric h3 {
  margin: 0;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  opacity: 0.75;
}
.metric .value {
  font-size: 1.5rem;
  font-weight: 600;
  margin: 6px 0 0;
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.metric .value small {
  font-size: 0.75rem;
  opacity: 0.8;
}
.metric .visual {
  position: relative;
  height: 46px;
  border-radius: 14px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.25);
}
.metric .visual::after,
.metric .visual::before {
  content: "";
  position: absolute;
  inset: 0;
  transition: transform 600ms ease, opacity 600ms ease, filter 600ms ease;
  pointer-events: none;
}
.metric[data-type="humidity"] .visual::after {
  inset: 10% 12% 6% 12%;
  border-radius: 18px 18px 24px 24px;
  background: linear-gradient(180deg, rgba(200, 240, 255, 0.55), rgba(90, 160, 220, 0.65));
  transform-origin: bottom;
  transform: scaleY(var(--humidity-level));
  filter: saturate(calc(0.7 + var(--humidity-level)));
}
.metric[data-type="humidity"] .visual::before {
  inset: 16% 30% auto 30%;
  height: 16px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.45);
  opacity: var(--humidity-glow);
  transform: translateY(calc((1 - var(--humidity-level)) * 18px));
}
.metric[data-type="wind"] .visual::before {
  inset: 18% 18% 18% 18%;
  border-radius: 999px;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.32)),
    rgba(255, 255, 255, 0.05);
  box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.12);
}
.metric[data-type="wind"] .visual::after {
  inset: 0;
  margin: 6px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  transform-origin: center;
  transform: rotate(var(--wind-angle));
  opacity: var(--wind-opacity);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0)),
    linear-gradient(90deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.65));
}
.metric[data-type="uv"] .visual::after {
  inset: 20% 12%;
  border-radius: 20px;
  background: linear-gradient(90deg, #6b2cf5, #18a4f7, #17f776, #f5ed2c, #f77a17, #ff1d1d);
  transform-origin: left;
  transform: scaleX(var(--uv-level));
  filter: saturate(1.4);
}
.metric[data-type="dew"] .visual::after {
  inset: 18% 16%;
  border-radius: 18px;
  background:
    radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.45), transparent 60%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(120, 180, 255, 0.05));
  transform: translateY(calc((0.5 - var(--dew-shift)) * 20px));
  opacity: var(--dew-opacity);
}
#temperature {
  font-size: 4.5rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  align-self: flex-start;
  text-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
}
#temperature span.unit {
  font-size: 2.2rem;
}
#uv-spectrum {
  height: 6px;
  border-radius: 10px;
  background: linear-gradient(90deg, #6b2cf5, #18a4f7, #17f776, #f5ed2c, #f77a17, #ff1d1d);
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.22);
}
#timeline {
  height: 76px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.06);
  position: relative;
  overflow: hidden;
}
#timeline canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.audio-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 18px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.08);
}
.audio-control button {
  border: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.05));
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 10px 20px rgba(0, 0, 0, 0.3);
  display: grid;
  place-items: center;
  color: var(--bg-color);
  transition: transform 260ms ease;
}
.audio-control button:hover {
  transform: scale(1.04);
}
.audio-control .volume {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
}
.audio-control input[type="range"] {
  flex: 1;
  appearance: none;
  height: 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.24);
  outline: none;
}
.audio-control input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent-color);
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.65);
}
.audio-control .music-title {
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.8;
}
#splash {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 16, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  color: #fff;
  z-index: 5;
  backdrop-filter: blur(10px);
}
#splash button {
  border: none;
  background: linear-gradient(120deg, rgba(255, 215, 114, 0.92), rgba(255, 94, 94, 0.95));
  color: #211f1b;
  padding: 14px 24px;
  border-radius: 999px;
  font-weight: 700;
  letter-spacing: 0.12em;
  cursor: pointer;
  box-shadow: 0 12px 30px rgba(255, 135, 63, 0.35);
}
#ripple-layer {
  position: absolute;
  inset: 0;
  border-radius: 30px;
  overflow: hidden;
  pointer-events: none;
  mix-blend-mode: screen;
}
.ripple {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.65), transparent 60%);
  opacity: 0.8;
  animation: ripple 1.2s ease-out forwards;
}
@keyframes ripple {
  0% {
    transform: scale(0);
    opacity: 0.85;
  }
  100% {
    transform: scale(8);
    opacity: 0;
  }
}
#spectral-bars {
  width: 92px;
  height: 32px;
  display: flex;
  gap: 4px;
  align-items: flex-end;
}
#spectral-bars span {
  flex: 1;
  height: 12px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.4);
}
footer {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#status-line {
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  opacity: 0.8;
  display: flex;
  justify-content: space-between;
}
.breathing {
  animation: breathing 8s ease-in-out infinite;
}
@keyframes breathing {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.01);
  }
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="card-wrapper">
  <div id="ripple-layer"></div>
  <article class="weather-card breathing" id="weatherCard">
    <header>
      <div class="title">Aurora Weather Atelier</div>
      <div class="scene-icon"><span id="sceneGlyph">☀️</span></div>
    </header>
    <div id="temperature"><span id="tempValue">26</span><span class="unit">°C</span></div>
    <div class="metrics">
      <div class="metric" data-type="humidity">
        <div class="visual" aria-hidden="true"></div>
        <h3>Humidity</h3>
        <div class="value"><span id="humidity">58</span><small>%</small></div>
      </div>
      <div class="metric" data-type="wind">
        <div class="visual" aria-hidden="true"></div>
        <h3>Wind</h3>
        <div class="value"><span id="windSpeed">12</span><small>km/h</small></div>
      </div>
      <div class="metric" data-type="uv">
        <div class="visual" aria-hidden="true"></div>
        <h3>UV Index</h3>
        <div class="value"><span id="uvIndex">4</span></div>
      </div>
      <div class="metric" data-type="dew">
        <div class="visual" aria-hidden="true"></div>
        <h3>Dew Point</h3>
        <div class="value"><span id="dewPoint">16</span><small>°C</small></div>
      </div>
    </div>
    <div id="uv-spectrum"></div>
    <div id="timeline"><canvas id="timelineCanvas" width="340" height="120"></canvas></div>
    <div class="scene-switcher">
      <button data-scene="sunny" class="active"><span class="icon">☀️</span><span class="label">Sunny</span></button>
      <button data-scene="rainy"><span class="icon">🌧️</span><span class="label">Rain</span></button>
      <button data-scene="snowy"><span class="icon">❄️</span><span class="label">Snow</span></button>
      <button data-scene="windy"><span class="icon">🌪️</span><span class="label">Wind</span></button>
    </div>
    <footer>
      <div class="audio-control">
        <button id="toggleAudio">▶</button>
        <div class="volume">
          <div id="spectral-bars"></div>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.72" />
        </div>
        <div class="music-title" id="musicTitle">Sunlit Pastoral</div>
      </div>
      <div id="status-line">
        <span id="sceneStatus">Sunset glow bathing the valley.</span>
        <span id="timeLabel">18:22</span>
      </div>
    </footer>
  </article>
</div>
<div id="splash">
  <h1>Tap to awaken the weather spirits</h1>
  <button id="startExperience">Begin Immersion</button>
</div>
<script>
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
const TAU = Math.PI * 2;
const rand = (min, max) => Math.random() * (max - min) + min;
const hexToRgb = (hex) => {
  const normalized = hex.replace("#", "");
  const bigint = parseInt(normalized, 16);
  const length = normalized.length === 3 ? 1 : 0;
  if (length) {
    const r = ((bigint >> 8) & 0xf) * 17;
    const g = ((bigint >> 4) & 0xf) * 17;
    const b = (bigint & 0xf) * 17;
    return { r, g, b };
  }
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return { r, g, b };
};
const rgbToHex = (r, g, b) => {
  const toHex = (v) => {
    const hex = Math.round(clamp(v, 0, 255)).toString(16);
    return hex.length === 1 ? `0${hex}` : hex;
  };
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
};
const mixHex = (a, b, t) => {
  const colorA = hexToRgb(a);
  const colorB = hexToRgb(b);
  return rgbToHex(
    lerp(colorA.r, colorB.r, t),
    lerp(colorA.g, colorB.g, t),
    lerp(colorA.b, colorB.b, t)
  );
};
const colorTemperatureToRGB = (kelvin) => {
  const temp = clamp(kelvin, 1000, 40000) / 100;
  let red;
  let green;
  let blue;
  if (temp <= 66) {
    red = 255;
    green = clamp(99.4708025861 * Math.log(temp) - 161.1195681661, 0, 255);
    blue = temp <= 19 ? 0 : clamp(138.5177312231 * Math.log(temp - 10) - 305.0447927307, 0, 255);
  } else {
    red = clamp(329.698727446 * Math.pow(temp - 60, -0.1332047592), 0, 255);
    green = clamp(288.1221695283 * Math.pow(temp - 60, -0.0755148492), 0, 255);
    blue = 255;
  }
  return `${Math.round(red)}, ${Math.round(green)}, ${Math.round(blue)}`;
};
const interpolateKeyframes = (keyframes, t) => {
  if (!keyframes || !keyframes.length) return {};
  const wrapped = ((t % 1) + 1) % 1;
  let previous = keyframes[0];
  let next = keyframes[keyframes.length - 1];
  for (let i = 0; i < keyframes.length; i++) {
    if (keyframes[i].t >= wrapped) {
      next = keyframes[i];
      break;
    }
    previous = keyframes[i];
  }
  const span = ((next.t - previous.t) + 1) % 1;
  const localT = span === 0 ? 0 : ((wrapped - previous.t + 1) % 1) / span;
  const result = {};
  const keys = new Set([...Object.keys(previous), ...Object.keys(next)]);
  keys.forEach((key) => {
    if (key === "t") return;
    const start = previous[key];
    const end = next[key];
    if (typeof start === "number" && typeof end === "number") {
      result[key] = lerp(start, end, localT);
    } else if (Array.isArray(start) && Array.isArray(end)) {
      result[key] = start.map((value, index) => {
        const endValue = end[index % end.length] || value;
        if (typeof value === "string" && value.startsWith("#")) {
          return mixHex(value, endValue, localT);
        }
        return lerp(value, endValue, localT);
      });
    } else if (typeof start === "string" && typeof end === "string" && start.startsWith("#") && end.startsWith("#")) {
      result[key] = mixHex(start, end, localT);
    } else {
      result[key] = localT < 0.5 ? start : end;
    }
  });
  return result;
};
class Perlin {
  constructor() {
    this.gradients = {};
  }
  generateGradient(x, y) {
    const angle = Math.random() * TAU;
    this.gradients[[x, y]] = { x: Math.cos(angle), y: Math.sin(angle) };
    return this.gradients[[x, y]];
  }
  dotGridGradient(ix, iy, x, y) {
    const key = ix + "," + iy;
    let gradient = this.gradients[key];
    if (!gradient) {
      gradient = this.generateGradient(ix, iy);
      this.gradients[key] = gradient;
    }
    const dx = x - ix;
    const dy = y - iy;
    return dx * gradient.x + dy * gradient.y;
  }
  smootherstep(t) {
    return t * t * t * (t * (t * 6 - 15) + 10);
  }
  noise(x, y) {
    const x0 = Math.floor(x);
    const x1 = x0 + 1;
    const y0 = Math.floor(y);
    const y1 = y0 + 1;
    const sx = this.smootherstep(x - x0);
    const sy = this.smootherstep(y - y0);
    const n0 = this.dotGridGradient(x0, y0, x, y);
    const n1 = this.dotGridGradient(x1, y0, x, y);
    const ix0 = lerp(n0, n1, sx);
    const n2 = this.dotGridGradient(x0, y1, x, y);
    const n3 = this.dotGridGradient(x1, y1, x, y);
    const ix1 = lerp(n2, n3, sx);
    return lerp(ix0, ix1, sy);
  }
}
const perlin = new Perlin();
class TimelineRibbon {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.phase = 0;
  }
  draw(scene, state = {}) {
    const { ctx, canvas } = this;
    const width = canvas.width;
    const height = canvas.height;
    ctx.clearRect(0, 0, width, height);
    const gradient = ctx.createLinearGradient(0, 0, width, 0);
    const colors = state.gradient && state.gradient.length ? state.gradient : scene.timelineColors.map((stop) => stop.color);
    colors.forEach((color, index) => {
      const pos = colors.length === 1 ? 0 : index / (colors.length - 1);
      gradient.addColorStop(pos, color);
    });
    ctx.fillStyle = gradient;
    ctx.fillRect(0, height / 2 - 24, width, 48);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath();
    ctx.moveTo(0, height / 2);
    for (let x = 0; x <= width; x += 8) {
      const t = x / width;
      const intensity = clamp(state.combinedWind ?? state.windIntensity ?? 0.5, 0.2, 1.4);
      const y = height / 2 + Math.sin(t * 4 * Math.PI + this.phase) * 18 * scene.waveStrength * (0.6 + intensity * 0.5);

const windSpeedValue = document.getElementById("windSpeed");
const uvIndexValue = document.getElementById("uvIndex");
const dewPointValue = document.getElementById("dewPoint");
const spectralBars = document.getElementById("spectral-bars");
for (let i = 0; i < 12; i++) {
  spectralBars.appendChild(document.createElement("span"));
}
const barElements = [...spectralBars.children];
const sceneButtons = document.querySelectorAll(".scene-switcher button");
sceneButtons.forEach((button) => {
  button.addEventListener("click", () => {
    const scene = button.dataset.scene;
    if (scene === currentScene) return;
    setScene(scene);
  });
});
function setScene(key) {
  currentScene = key;
  sceneButtons.forEach((btn) => btn.classList.toggle("active", btn.dataset.scene === key));
  const scene = scenes[key];
  glyph.textContent = scene.glyph;
  statusLine.textContent = scene.description;
  document.documentElement.style.setProperty("--scene-hue", scene.baseHue);
  document.documentElement.style.setProperty("--accent-color", scene.palette[3]);
  document.documentElement.style.setProperty("--bg-color", scene.palette[0]);
  document.documentElement.style.setProperty(
    "--glow-strength",
    key === "rainy" ? 0.38 : key === "sunny" ? 0.6 : key === "snowy" ? 0.48 : 0.52
  );
  musicTitle.textContent = scene.title;
  updateMetrics(key);
  updateDynamicState(0, true);
  if (allowAudio) {
    musicEngine.switchScene(key);
  }
}
function updateMetrics(scene) {
  const presets = {
    sunny: { temp: 29, humidity: 58, wind: 12, uv: 6, dew: 18 },
    rainy: { temp: 19, humidity: 92, wind: 22, uv: 1, dew: 17 },
    snowy: { temp: -6, humidity: 78, wind: 14, uv: 2, dew: -9 },
    windy: { temp: 12, humidity: 64, wind: 48, uv: 3, dew: 5 },
  };
  const values = presets[scene];
  tempValue.textContent = values.temp;
  humidityValue.textContent = values.humidity;
  windSpeedValue.textContent = values.wind;
  uvIndexValue.textContent = values.uv;
  dewPointValue.textContent = values.dew;
  const humidityLevel = clamp(values.humidity / 100, 0, 1);
  document.documentElement.style.setProperty("--humidity-level", humidityLevel.toFixed(2));
  document.documentElement.style.setProperty(
    "--humidity-glow",
    clamp(0.3 + humidityLevel * 0.7, 0.3, 0.95).toFixed(2)
  );
  const windLevel = clamp(values.wind / 80, 0, 1);
  document.documentElement.style.setProperty("--wind-level", windLevel.toFixed(2));
  dynamicState.metricWind = windLevel;
  const uvLevel = clamp(values.uv / 11, 0, 1);
  document.documentElement.style.setProperty("--uv-level", uvLevel.toFixed(2));
  const dewShift = clamp((values.dew + 20) / 60, 0, 1);
  document.documentElement.style.setProperty("--dew-shift", dewShift.toFixed(2));
  document.documentElement.style.setProperty(
    "--dew-opacity",
    clamp(0.45 + Math.abs(0.5 - dewShift) * 0.6, 0.45, 0.95).toFixed(2)
  );
}
function updateTime() {
  const now = new Date();
  const hh = now.getHours().toString().padStart(2, "0");
  const mm = now.getMinutes().toString().padStart(2, "0");
  timeLabel.textContent = `${hh}:${mm}`;
}
updateTime();
setInterval(updateTime, 60000);
const startButton = document.getElementById("startExperience");
startButton.addEventListener("click", async () => {
  document.getElementById("splash").style.display = "none";
  await musicEngine.resume();
  allowAudio = true;
  setScene(currentScene);
  musicEngine.switchScene(currentScene);
});
const toggleAudio = document.getElementById("toggleAudio");
toggleAudio.addEventListener("click", async () => {
  await musicEngine.resume();
  const running = musicEngine.togglePause();
  toggleAudio.textContent = running ? "⏸" : "▶";
});
const volumeRange = document.getElementById("volume");
volumeRange.addEventListener("input", (event) => {
  musicEngine.setVolume(parseFloat(event.target.value));
});
function animateSpectralBars() {
  const analyser = musicEngine.getAnalyser();
  if (analyser) {
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    barElements.forEach((bar, index) => {
      const value = data[index * 2] / 255;
      bar.style.height = `${12 + value * 20}px`;
      bar.style.background = `linear-gradient(180deg, rgba(255,255,255,${0.6 + value * 0.4}), rgba(255,255,255,0.1))`;
    });
  }
  requestAnimationFrame(animateSpectralBars);
}
animateSpectralBars();
function animate(now) {
  if (lastFrameTime === null) {
    lastFrameTime = now;
  }
  const delta = (now - lastFrameTime) / 1000;
  lastFrameTime = now;
  updateDynamicState(delta);
  const analyser = musicEngine.getAnalyser();
  sky.render(currentScene, analyser, dynamicState);
  timeline.draw(scenes[currentScene], dynamicState);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
card.addEventListener("mousemove", (event) => {
  const rect = card.getBoundingClientRect();
  const percentX = (event.clientX - rect.left) / rect.width * 2 - 1;
  const percentY = (event.clientY - rect.top) / rect.height * 2 - 1;
  const rotateX = percentY * 6;
  const rotateY = percentX * -6;
  card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});
card.addEventListener("mouseleave", () => {
  card.style.transform = "rotateX(0deg) rotateY(0deg)";
});
document.addEventListener("mousemove", (event) => {
  document.documentElement.style.setProperty("--pointer-x", `${event.clientX}px`);
  document.documentElement.style.setProperty("--pointer-y", `${event.clientY}px`);
  document.documentElement.style.setProperty("--pointer-active", "1");
});
window.addEventListener("mouseout", (event) => {
  if (!event.relatedTarget && !event.toElement) {
    document.documentElement.style.setProperty("--pointer-active", "0");
  }
});
card.addEventListener("click", (event) => {
  const colorMap = {
    sunny: "rgba(255,220,160,0.75)",
    rainy: "rgba(120,180,255,0.6)",
    snowy: "rgba(190,235,255,0.7)",
    windy: "rgba(200,255,200,0.65)",
  };
  rippleLayer.spawn(event.offsetX, event.offsetY, colorMap[currentScene]);
  if (allowAudio) {
    const now = musicEngine.context.currentTime;
    const osc = musicEngine.context.createOscillator();
    const gain = musicEngine.context.createGain();
    osc.type = "sine";
    osc.frequency.value = rand(600, 900);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
    osc.connect(gain);
    gain.connect(musicEngine.masterGain);
    osc.start();
    osc.stop(now + 0.5);
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && musicEngine.context.state === "running") {
    musicEngine.context.suspend();
  }
});
setScene("sunny");
</script>
</body>
</html>
